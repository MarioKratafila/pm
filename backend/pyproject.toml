[project]
name = "pm-backend"
version = "0.1.0"
description = "Backend for the project management MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.23.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.28.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
